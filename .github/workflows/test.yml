name: test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm test

  gate:                      # the one context Phase 6 requires
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: All matrix legs must pass
        run: test "${{ needs.test.result }}" = "success"

  publish:                   # on a v* tag: npm via trusted publishing (OIDC, no token), then the MCP registry
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm trusted publishing and provenance; MCP registry github-oidc login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: The tag must equal v + package.json version
        run: >-
          node -e "const v = 'v' + require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== v) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json ' + v); process.exit(1); }"
      - name: Trusted publishing needs npm 11.5.1+
        run: npm install -g npm@^11.5.1
      - run: npm ci --ignore-scripts
      - run: npm publish --provenance --access public
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: '1.8.1'
        run: >-
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
